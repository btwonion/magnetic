name: build-commit

on:
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "changelog.md"
      - ".editorconfig"
      - "../../fabric/src/*/resources/lang/*"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "changelog.md"
      - ".editorconfig"
      - "../../fabric/src/*/resources/lang/*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.project }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: mod, target: 1.21.1-fabric }
          - { project: mod, target: 1.21.1-neoforge }
          - { project: mod, target: 1.21.11-fabric }
          - { project: mod, target: 1.21.11-neoforge }
          - { project: mod, target: 26.1.2-fabric }
          - { project: mod, target: 26.1.2-neoforge }
          - { project: mod, target: 26.2-fabric }
          - { project: mod, target: 26.2-neoforge }
          - { project: mod, target: 26.3-fabric, gametest: true }
          - { project: mod, target: 26.3-neoforge, gametest: true }
          - { project: mod, target: 26.4-fabric }
          - { project: paper, target: 1.21.1, gametest: true }
          - { project: paper, target: 1.21.6, gametest: true }
          - { project: paper, target: 26.1, gametest: true }

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew :${{ matrix.project }}:${{ matrix.target }}:build --stacktrace
      - name: Run headless gameplay tests
        if: matrix.gametest
        run: ./gradlew :${{ matrix.project }}:${{ matrix.target }}:runGameTest --stacktrace
      - name: Store test reports and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.project }}-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            ${{ matrix.project }}/versions/${{ matrix.target }}/build/reports/
            ${{ matrix.project }}/versions/${{ matrix.target }}/build/test-results/
            ${{ matrix.project }}/versions/${{ matrix.target }}/build/run/**/logs/
            ${{ matrix.project }}/versions/${{ matrix.target }}/build/run/**/crash-reports/
            ${{ matrix.project }}/versions/${{ matrix.target }}/build/run/**/magnetic-gametest-results.txt
      - name: Store build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: magnetic-${{ matrix.project }}-${{ matrix.target }}
          path: ${{ matrix.project }}/versions/${{ matrix.target }}/build/libs/*.jar
