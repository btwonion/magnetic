name: build-commit

on:
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "changelog.md"
      - ".editorconfig"
      - "../../fabric/src/*/resources/lang/*"
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "changelog.md"
      - ".editorconfig"
      - "../../fabric/src/*/resources/lang/*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build with Gradle

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build testGameLatest --stacktrace
      - name: Store test reports and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/build/run/**/crash-reports/
      - uses: actions/upload-artifact@v7
        with:
          path: ./**/build/libs/*.jar
