name: sync-readme

on:
  workflow_dispatch:

jobs:
  modrinth-description:
    runs-on: ubuntu-latest
    name: Sync Modrinth description
    steps:
      - uses: actions/checkout@v7
      - uses: btwonion/mc-readme-sync@v1.0.0
        with:
          modrinth-api-key: ${{ secrets.MODRINTH_API_KEY }}
          curseforge-api-key: ${{ secrets.CURSEFORGE_API_KEY }}
          modrinth-project-id: "LLfA8jAD"
          curseforge-project-id: "1244695"
          readme-path: README.md